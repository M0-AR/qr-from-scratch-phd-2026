<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" font-family="system-ui,sans-serif">
<defs><style>.b{fill:#0f172a;stroke:#38bdf8;stroke-width:2;rx:12}.t{fill:#e2e8f0;font-size:15px;font-weight:700;text-anchor:middle}.s{fill:#94a3b8;font-size:12px;text-anchor:middle}.a{stroke:#38bdf8;stroke-width:2;marker-end:url(#ah)}</style>
<marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#38bdf8" stroke-width="2"/></marker></defs>
<rect width="900" height="170" rx="16" fill="#020617"/>
<rect x="20" y="25" width="155" height="90" rx="12" class="b"/><text x="97" y="52" class="t">1 ENCODE</text><text x="97" y="72" class="s">0100 + len + bytes</text><line x1="175" y1="70" x2="195" y2="70" class="a"/><rect x="195" y="25" width="155" height="90" rx="12" class="b"/><text x="272" y="52" class="t">2 ECC</text><text x="272" y="72" class="s">Reed–Solomon</text><text x="272" y="90" class="s">GF(256) +10B</text><line x1="350" y1="70" x2="370" y2="70" class="a"/><rect x="370" y="25" width="155" height="90" rx="12" class="b"/><text x="447" y="52" class="t">3 PLACE</text><text x="447" y="72" class="s">zigzag 21×21</text><text x="447" y="90" class="s">skip col 6</text><line x1="525" y1="70" x2="545" y2="70" class="a"/><rect x="545" y="25" width="155" height="90" rx="12" class="b"/><text x="622" y="52" class="t">4 MASK</text><text x="622" y="72" class="s">8 patterns</text><text x="622" y="90" class="s">penalty → 0</text><line x1="700" y1="70" x2="720" y2="70" class="a"/><rect x="720" y="25" width="155" height="90" rx="12" class="b"/><text x="797" y="52" class="t">5 FORMAT</text><text x="797" y="72" class="s">15 bits ×2</text><text x="797" y="90" class="s">0x5412</text><text x="450" y="140" class="s">hello, world → V1-M mask 0 → OpenCV reads hello, world</text>
</svg>